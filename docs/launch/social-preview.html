<!doctype html>
<!-- The GitHub social preview (docs/social-preview.png, 1280x640). Re-make it: open this file in a
     headless Edge or Chrome at 1280x640 and take a screenshot; see docs/launch/REPO_SETUP.md. -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden}
  body{font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 15% 20%,#5b2748 0%,#2b1530 55%,#1c0f22 100%);color:#fff;position:relative}
  .left{position:absolute;left:64px;top:64px;width:560px}
  .brand{display:flex;align-items:center;gap:28px}
  .brand img{width:132px;height:132px;border-radius:32px;box-shadow:0 10px 30px rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.85)}
  h1{font-size:112px;line-height:1;margin:0;font-weight:700;letter-spacing:-2px}
  .pitch{font-size:38px;line-height:1.22;margin:38px 0 0;font-weight:600;color:#ffe9f1}
  .chips{display:flex;flex-wrap:wrap;gap:14px;margin-top:40px}
  .chip{font-size:25px;font-weight:600;padding:10px 20px;border-radius:999px;background:#d0446f;color:#fff}
  .chip.alt{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35)}
  .shot{position:absolute;right:-40px;top:92px;width:640px;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55);border:3px solid rgba(255,255,255,.18);transform:rotate(-2deg)}
  .shot img{display:block;width:100%}
  .foot{position:absolute;right:64px;bottom:40px;font-size:24px;color:#e9c9d6;font-weight:600}
</style></head><body>
  <div class="left">
    <div class="brand"><img src="../../web/icon-512.png" alt=""><h1>Sara</h1></div>
    <p class="pitch">A self-hosted AI companion who is also a real coding partner.</p>
    <div class="chips">
      <span class="chip">Self-hosted</span><span class="chip">MIT</span><span class="chip">Local models</span>
      <span class="chip alt">Builds &amp; tests code</span><span class="chip alt">Voice &amp; phone apps</span>
    </div>
  </div>
  <div class="shot"><img src="../screenshots/coding.webp" alt=""></div>
  <div class="foot">github.com/farena-ai/sara</div>
</body></html>
