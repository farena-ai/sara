# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
# Installer manifest (Phase 57). scripts/update-packaging.ts fills PackageVersion, InstallerUrl and
# InstallerSha256 from outputs/release/<version>/SHA256SUMS.
# winget installs Sara for the signed-in user (no administrator): her server runs while you're
# signed in. For a Windows service, run the installer yourself (it asks).
PackageIdentifier: BackstageCoding.Sara
PackageVersion: 3.6.1
InstallerLocale: en-US
MinimumOSVersion: 10.0.17763.0
InstallerType: inno
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
InstallerSwitches:
  Silent: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /MODE=user
  SilentWithProgress: /SILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /MODE=user
  Custom: /CURRENTUSER /MODE=user
UpgradeBehavior: install
ProductCode: '{6F0B2C1E-7A51-4C8B-9E2D-3B5A0C9D4E17}_is1'
ReleaseDate: 2026-11-12
AppsAndFeaturesEntries:
  - DisplayName: Sara
    Publisher: Backstage Coding
    ProductCode: '{6F0B2C1E-7A51-4C8B-9E2D-3B5A0C9D4E17}_is1'
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/farena-ai/sara/releases/download/v3.6.1/Sara-Setup-3.6.1.exe
    InstallerSha256: EE1FB8A5BB07CBDB39860BC206D49880F91ED3C96A8A9AEECC34C4DCD789FE69
ManifestType: installer
ManifestVersion: 1.10.0
