    Publisher: Backstage Coding
    ProductCode: '{6F0B2C1E-7A51-4C8B-9E2D-3B5A0C9D4E17}_is1'
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/farena-ai/sara/releases/download/v2.24.0/Sara-Setup-2.24.0.exe
    InstallerSha256: BC8143EC5DF566CAC35197EBF8EAC8ABA6164165CD3602102AD72B2E18420795
ManifestType: installer
ManifestVersion: 1.10.0
