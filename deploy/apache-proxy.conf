# Apache reverse proxy for Sara: these lines go inside the HTTPS (<VirtualHost *:443>) site.
#   Debian/Ubuntu: sudo a2enmod proxy proxy_http proxy_wstunnel headers, then a full site example
#                  is in docs/INSTALL.md section 2 (Apache).
#   cPanel:        place this file in
#                  /etc/apache2/conf.d/userdata/ssl/2_4/<cpanel-user>/<domain>/sara-proxy.conf
#                  then run /scripts/rebuildhttpdconf && systemctl reload httpd.
# Requires mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_headers (mod_rewrite only for the old-Apache lines). Tell Sara she is behind a
# proxy: sudo SARA_BEHIND_PROXY=1 /opt/sara-src/deploy/install.sh
# Change 7860 if you changed SARA_PORT.
ProxyRequests Off
ProxyPreserveHost On
ProxyPass "/.well-known/acme-challenge/" "!"
# Live voice calls (WebSocket); must come before the "/" line.
ProxyPass "/api/live/" "ws://127.0.0.1:7860/api/live/" timeout=3700 retry=0
# flushpackets=on keeps streamed replies (Server-Sent Events) from being buffered.
# upgrade=websocket (Apache 2.4.47 or newer) passes every WebSocket through, above all computer use:
# the Sara app's connection to /api/hands. Without it the app says "the web server in front of this
# Sara blocks the connection" and Sara can't use the computer. (`httpd -v` / `apache2 -v` shows the version.)
ProxyPass "/" "http://127.0.0.1:7860/" timeout=600 retry=0 flushpackets=on upgrade=websocket
# Older Apache (before 2.4.47): remove upgrade=websocket above and use these instead (needs mod_rewrite):
#   RewriteEngine On
#   RewriteCond %{HTTP:Upgrade} =websocket [NC]
#   RewriteRule ^/api/hands$ ws://127.0.0.1:7860/api/hands [P,L]
ProxyPassReverse "/" "http://127.0.0.1:7860/"
RequestHeader set X-Forwarded-Proto "https"
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
