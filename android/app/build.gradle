apply plugin: 'com.android.application'

// Release signing: put keystore.properties (storeFile, storePassword, keyAlias, keyPassword) next
// to this file, or keep it as ../.secrets/sara-android-upload.properties (the publisher's upload
// key). Neither is ever committed. Without one, release builds are unsigned.
def ksFile = rootProject.file('keystore.properties')
if (!ksFile.exists()) ksFile = rootProject.file('../.secrets/sara-android-upload.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.backstagecoding.sara'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.backstagecoding.sara'
        minSdk 26
        targetSdk 36
        versionCode 30700
        versionName '3.7.0'
        // C17: the Hey Sara engine per ABI (fetch-wake-libs.sh); x86_64 is for the emulator.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // C17: Sara's JNI shim over sherpa-onnx's C API (src/main/cpp; a stub when the header isn't fetched).
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
